<!--
  BASE. A register of what arrived from the field, and nothing else.

  No model, no corpus, no retriever behind this page. Everything it shows was
  rendered on a field device and carried here inside a bundle base verified
  against its own sha256, which is why the citations and the guard removals
  are the field device's own and not something base recomputed.

  Built from 06-demo/BASE-DESIGN.md. See base.js for the one deviation, forced
  by base being a separate process on its own port.
-->
<div class="wrap">
  <div class="brand"><span class="dot" aria-hidden="true"></span><b translate="no">Grounded</b><span class="role">Base</span></div>
  <div id="main"><p class="fine">Loading…</p></div>
  <footer class="note">Base holds no model and no corpus. Every verdict, citation and guard action
    here was produced on the field device that sent it. Marking something reviewed records that a
    person looked; it changes nothing about the assessment and never goes back to the device.</footer>
</div>
