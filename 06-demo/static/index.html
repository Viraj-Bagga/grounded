<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2f4f7">
<title>Triage</title>
<link rel="preload" href="/fonts/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<!--
THESIS: A triage conversation in the health worker's handset grammar: numbered, bold, one hand in bad light. It refuses the chatbot bubble stack and the soft health-app card grid.
OWN-WORLD: Paper white, cool chrome grey, near-black ink, one action blue. Triage colours only in full-width urgency bars. Refusal hatched, not-grounded dashed, removed struck through. Atkinson Hyperlegible, its mono for keys and measurements. Square bars, keypad numerals, 6px controls, one drawn icon set.
STORY: The person says what is happening, watches four steps work, reads the urgency first, then what to do, then why, and opens any source. Follow-ups reuse what was read and say so.
FIRST VIEWPORT: Nearly blank. Empty: paper, with three presets and two lines of scope CENTRED in the space above the composer, and who this is for. No profile card and no chip row. Answered: a full-width urgency bar with rule lines pinned under it, then numbered steps.
FORM: The Health Worker's Handset, grounded list position 4, seed 18445d6f.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div class="app">
  <nav class="side" id="side" aria-label="Assessments">
    <div class="side-head">
      <div class="mark"><span class="dot" aria-hidden="true"></span>Triage</div>
      <a class="new-btn" href="/" data-link><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New assessment</a>
    </div>
    <div class="history" id="history"></div>
    <div class="side-foot">
      <a class="foot-link" id="queue-link" href="/queue" data-link>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.8" cy="6" r="1.3"/><circle cx="3.8" cy="12" r="1.3"/><circle cx="3.8" cy="18" r="1.3"/></svg>
        Caseload<span class="n" id="queue-n"></span></a>
      <a class="foot-link" id="people-link" href="/people" data-link>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18.5 14.2a6.5 6.5 0 0 1 3 5.8"/></svg>
        People<span class="n" id="people-n"></span></a>
      <a class="foot-link" id="region-link" href="/regions" data-link>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18Z"/></svg>
        Region<span class="n">Base only</span></a>
      <div class="status" id="status" role="status"></div>
    </div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="top">
      <button class="icon-btn" id="menu" type="button" aria-label="Assessments and people" aria-expanded="false" aria-controls="side">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span class="grow"></span>
      <a class="icon-btn" href="/" data-link aria-label="New assessment">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></a>
    </header>
    <main id="main" tabindex="-1"><div class="page"><p class="loading">Loading…</p></div></main>
  </div>
</div>

<dialog class="sheet" id="picker" aria-labelledby="picker-h">
  <div class="sh-head"><span class="k" id="picker-h">Who is this for?</span>
    <button class="icon-btn" id="picker-x" type="button" aria-label="Close">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="sh-body" id="picker-body" style="padding:0;white-space:normal"></div>
</dialog>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-k">
  <div class="sh-head"><span class="k" id="sheet-k"></span><span class="n" id="sheet-n"></span>
    <button class="icon-btn" id="sheet-x" type="button" aria-label="Close">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="sh-body" id="sheet-body"></div>
  <div class="sh-foot" id="sheet-foot"></div>
</dialog>
</body>
</html>
